<title>The Improbable Apparatus</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="A 3D chain-reaction puzzle workshop: build ridiculous machines from ramps, fans, dominoes and balloons.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil+Display:wght@700;800;900&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: full-bleed 3D workbench; blueprint-paper HUD panels float over it —
   brand + work order up top, parts bin on the right, tool dock at the bottom. */
:root {
  --ink: #091629;
  --paper: #123766;
  --paper-2: #0f2d55;
  --line: rgba(176, 214, 255, 0.26);
  --line-strong: rgba(200, 228, 255, 0.55);
  --chalk: #eef5ff;
  --muted: #a6bddb;
  --signal: #ff7b22;
  --signal-deep: #d65a0b;
  --brass: #e8b75e;
  --ok: #62e3a4;
  --bad: #ff5e50;
  --shadow: rgba(3, 9, 20, 0.5);
  --font-display: "Big Shoulders Stencil Display", Impact, "Arial Narrow Bold", sans-serif;
  --font-body: "Barlow", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 6px;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden; background: var(--ink); color: var(--chalk);
  font-family: var(--font-body); font-size: 15px; -webkit-font-smoothing: antialiased;
  user-select: none; -webkit-user-select: none; touch-action: none;
}
#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
button { font: inherit; color: inherit; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }

/* ---- blueprint paper ---------------------------------------------------- */
.paper {
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--line) 1px, transparent 1px),
    linear-gradient(90deg, var(--line) 1px, transparent 1px),
    linear-gradient(rgba(176,214,255,0.08) 1px, transparent 1px),
    linear-gradient(90deg, rgba(176,214,255,0.08) 1px, transparent 1px);
  background-size: 40px 40px, 40px 40px, 8px 8px, 8px 8px;
  background-position: -1px -1px;
  border: 1px solid var(--line-strong);
  border-radius: var(--r);
  box-shadow: 0 12px 34px var(--shadow), inset 0 0 0 3px rgba(9, 22, 41, 0.35);
}
.eyebrow { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.stencil { font-family: var(--font-display); font-weight: 800; letter-spacing: 0.02em; text-transform: uppercase; line-height: 0.95; }

/* ---- HUD frame ---------------------------------------------------------- */
#hud { position: fixed; inset: 0; pointer-events: none; }
#hud > * { pointer-events: auto; }
.top-left { position: absolute; top: calc(14px + env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 4px; max-width: 34vw; }
.brand { font-family: var(--font-display); font-weight: 900; font-size: 22px; letter-spacing: 0.03em; text-transform: uppercase; color: var(--chalk); text-shadow: 0 2px 0 var(--ink); line-height: 1; cursor: pointer; background: none; border: 0; padding: 0; text-align: left; }
.brand span { color: var(--signal); }
.level-name { font-family: var(--font-mono); font-size: 12px; color: var(--muted); letter-spacing: 0.06em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.workorder { position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); padding: 10px 16px 12px; min-width: 260px; max-width: min(520px, 46vw); }
.workorder .eyebrow { display: flex; justify-content: space-between; gap: 18px; }
.goals { list-style: none; margin: 6px 0 0; padding: 0; display: grid; gap: 4px; }
.goals li { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 15px; }
.goals .box { width: 18px; height: 18px; border: 2px solid var(--chalk); border-radius: 3px; flex: none; display: grid; place-items: center; transition: background .2s, border-color .2s; }
.goals li.done .box { background: var(--ok); border-color: var(--ok); }
.goals li.done .box::after { content: ""; width: 5px; height: 9px; border: solid var(--ink); border-width: 0 2.5px 2.5px 0; transform: rotate(45deg) translate(-1px, -1px); }
.goals li.done span { color: var(--ok); }
.goals li.sandbox { font-weight: 500; color: var(--muted); font-size: 14px; }

.top-right { position: absolute; top: calc(14px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); display: flex; gap: 8px; }
.icon-btn { width: 42px; height: 42px; display: grid; place-items: center; border-radius: var(--r); cursor: pointer; padding: 0; }
.icon-btn svg { width: 20px; height: 20px; stroke: var(--chalk); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.icon-btn:hover { border-color: var(--chalk); }
.icon-btn.off svg .wave { display: none; }
.icon-btn:not(.off) svg .mute { display: none; }

/* ---- parts bin --------------------------------------------------------- */
.bin { position: absolute; right: max(16px, env(safe-area-inset-right, 0px)); top: calc(68px + env(safe-area-inset-top, 0px)); max-height: calc(100% - 180px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); width: 216px; display: flex; flex-direction: column; padding: 10px 10px 12px; }
.bin-head { display: flex; align-items: baseline; justify-content: space-between; padding: 0 2px 8px; border-bottom: 1px dashed var(--line-strong); margin-bottom: 8px; }
.bin-head .stencil { font-size: 22px; }
.bin-list { overflow-y: auto; overflow-x: hidden; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; align-content: start; padding: 2px; scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }
.bin-cat { grid-column: 1 / -1; margin-top: 4px; }
.card { position: relative; background: rgba(9, 22, 41, 0.55); border: 1px solid var(--line); border-radius: 5px; padding: 6px 4px 6px; display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; transition: transform .12s, border-color .12s, background .12s; }
.card:hover { border-color: var(--chalk); transform: translateY(-1px); background: rgba(9, 22, 41, 0.75); }
.card.active { border-color: var(--signal); box-shadow: 0 0 0 2px var(--signal) inset; }
.card.empty { opacity: 0.38; cursor: default; transform: none; }
.card img { width: 72px; height: 72px; object-fit: contain; pointer-events: none; }
.card .nm { font-size: 12px; font-weight: 600; text-align: center; line-height: 1.1; min-height: 2.2em; display: flex; align-items: center; }
.card .ct { position: absolute; top: 4px; right: 5px; font-family: var(--font-mono); font-size: 12px; font-weight: 600; background: var(--chalk); color: var(--ink); border-radius: 3px; padding: 0 4px; line-height: 1.4; }
.card .key { position: absolute; top: 4px; left: 6px; font-family: var(--font-mono); font-size: 10px; color: var(--muted); }
.bin-empty-note { grid-column: 1 / -1; color: var(--muted); font-size: 13px; padding: 8px 2px; line-height: 1.4; }

#tip { position: fixed; z-index: 30; width: 230px; padding: 10px 12px; pointer-events: none; font-size: 13.5px; line-height: 1.4; }
#tip b { display: block; font-family: var(--font-display); font-size: 19px; font-weight: 800; text-transform: uppercase; letter-spacing: .02em; margin-bottom: 3px; }
#tip .lock { color: var(--brass); font-family: var(--font-mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; display: block; margin-top: 5px; }

/* ---- dock --------------------------------------------------------------- */
.dock { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); display: flex; align-items: stretch; gap: 10px; padding: 8px; }
.tools { display: flex; gap: 6px; }
.tool { min-width: 60px; padding: 6px 8px 5px; border-radius: 5px; border: 1px solid var(--line); background: rgba(9,22,41,0.5); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.tool svg { width: 20px; height: 20px; stroke: var(--chalk); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.tool span { font-size: 11.5px; font-weight: 600; }
.tool kbd { font-family: var(--font-mono); font-size: 10px; color: var(--muted); }
.tool:hover:not(:disabled) { border-color: var(--chalk); }
.tool:disabled { opacity: 0.35; cursor: default; }
.tool .chdot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--chalk); background: #8a919b; margin: 3px 0; }
.sep { width: 1px; background: var(--line-strong); margin: 4px 2px; }
.run-btn { min-width: 168px; border: 0; border-radius: 5px; background: var(--signal); color: #1b0d02; cursor: pointer; font-family: var(--font-display); font-weight: 900; font-size: 26px; letter-spacing: 0.04em; text-transform: uppercase; padding: 4px 18px; display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 4px 0 var(--signal-deep), 0 8px 18px rgba(255,123,34,.3); transition: transform .08s, box-shadow .08s; }
.run-btn:hover { filter: brightness(1.06); }
.run-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--signal-deep); }
.run-btn svg { width: 20px; height: 20px; fill: currentColor; }
.run-btn.running { background: var(--chalk); box-shadow: 0 4px 0 #8aa3c4; }
.speed { display: flex; flex-direction: column; justify-content: center; gap: 4px; }
.speed button { font-family: var(--font-mono); font-size: 11px; font-weight: 600; padding: 3px 7px; border-radius: 4px; border: 1px solid var(--line); background: rgba(9,22,41,0.5); cursor: pointer; }
.speed button.on { background: var(--chalk); color: var(--ink); border-color: var(--chalk); }

.status { position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(104px + env(safe-area-inset-bottom, 0px)); max-width: min(420px, 40vw); font-size: 13px; color: var(--muted); line-height: 1.45; text-shadow: 0 1px 2px var(--ink); }
.status b { color: var(--chalk); font-weight: 600; }
.status kbd { font-family: var(--font-mono); font-size: 11px; border: 1px solid var(--line-strong); border-radius: 3px; padding: 0 4px; color: var(--chalk); background: rgba(9,22,41,0.6); }

#toast { position: fixed; left: 50%; top: 24%; transform: translate(-50%, -8px); padding: 10px 18px; font-weight: 600; opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none; z-index: 25; text-align: center; max-width: min(460px, 86vw); }
#toast.show { opacity: 1; transform: translate(-50%, 0); }
#toast.warn { border-color: var(--brass); }

#hoverLabel { position: fixed; z-index: 20; pointer-events: none; font-family: var(--font-mono); font-size: 12px; padding: 3px 7px; background: rgba(9,22,41,0.85); border: 1px solid var(--line-strong); border-radius: 4px; transform: translate(14px, 10px); white-space: nowrap; }

/* ---- modals ------------------------------------------------------------- */
.modal-wrap { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); background: rgba(5, 12, 24, 0.45); backdrop-filter: blur(2px); }
.modal { width: min(640px, 100%); max-height: 100%; overflow: auto; padding: 22px 26px 22px; position: relative; }
.modal h2 { font-family: var(--font-display); font-weight: 900; font-size: 46px; margin: 4px 0 10px; text-transform: uppercase; letter-spacing: .01em; line-height: .95; text-wrap: balance; }
.modal p { line-height: 1.55; margin: 0 0 12px; max-width: 62ch; }
.note { font-family: var(--font-body); font-size: 16px; line-height: 1.55; padding: 12px 14px; background: rgba(9,22,41,0.45); border-left: 3px solid var(--brass); border-radius: 0 4px 4px 0; margin: 10px 0 14px; }
.note .sig { display: block; margin-top: 6px; font-family: var(--font-mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--brass); }
.row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
.btn { border-radius: 5px; padding: 10px 18px; font-weight: 700; font-size: 15px; cursor: pointer; border: 1px solid var(--line-strong); background: rgba(9,22,41,0.5); }
.btn:hover { border-color: var(--chalk); }
.btn.primary { background: var(--signal); border-color: var(--signal); color: #1b0d02; box-shadow: 0 3px 0 var(--signal-deep); }
.btn.primary:hover { filter: brightness(1.06); }
.modal .close { position: absolute; top: 12px; right: 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; padding: 3px 8px 3px 4px; border: 1px solid var(--line); border-radius: 4px; background: rgba(9,22,41,.45); }
.chip img { width: 28px; height: 28px; }
.chip b { font-family: var(--font-mono); font-size: 12px; }

.stars { display: flex; gap: 6px; margin: 4px 0 12px; }
.star { width: 44px; height: 44px; }
.star path { fill: rgba(9,22,41,.6); stroke: var(--line-strong); stroke-width: 1.5; }
.star.on path { fill: var(--brass); stroke: #fff2cc; }
.star.pop { animation: starpop .5s cubic-bezier(.2,1.6,.4,1) both; }
@keyframes starpop { from { transform: scale(0) rotate(-40deg); } to { transform: scale(1) rotate(0); } }
.stat-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 4px; font-size: 14.5px; }
.stat-list li { display: flex; gap: 8px; align-items: baseline; }
.stat-list .k { font-family: var(--font-mono); font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; min-width: 140px; }
.stat-list .y { color: var(--ok); }

/* level select */
.levels { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-top: 8px; }
.lvl { text-align: left; padding: 10px 12px 10px; border-radius: 5px; border: 1px solid var(--line); background: rgba(9,22,41,.5); cursor: pointer; display: flex; flex-direction: column; gap: 4px; min-height: 92px; }
.lvl:hover { border-color: var(--chalk); }
.lvl .n { font-family: var(--font-mono); font-size: 11px; color: var(--muted); letter-spacing: .1em; }
.lvl .t { font-family: var(--font-display); font-weight: 800; font-size: 21px; text-transform: uppercase; line-height: 1; }
.lvl .s { margin-top: auto; font-size: 15px; letter-spacing: 2px; color: var(--line-strong); }
.lvl .s .on { color: var(--brass); }
.lvl.next { border-color: var(--signal); }
.lvl.sandbox { background: rgba(232,183,94,.12); border-color: rgba(232,183,94,.5); }

/* help */
.keys { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; align-items: baseline; font-size: 14.5px; margin: 6px 0 4px; }
.keys .k { white-space: nowrap; color: var(--muted); font-size: 13px; }
.keys kbd { display: inline-block; font-family: var(--font-mono); font-size: 12px; color: var(--chalk); border: 1px solid var(--line-strong); border-radius: 3px; padding: 1px 6px; background: rgba(9,22,41,.6); }
.modal h3 { font-family: var(--font-display); font-weight: 800; font-size: 24px; text-transform: uppercase; margin: 18px 0 6px; letter-spacing: .02em; }

/* title */
#title { position: fixed; inset: 0; z-index: 35; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; padding: max(28px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(28px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); background: linear-gradient(90deg, rgba(9,22,41,0.92) 0%, rgba(9,22,41,0.7) 38%, rgba(9,22,41,0) 70%); }
#title .inner { width: min(560px, 100%); margin-left: clamp(0px, 5vw, 80px); }
#title h1 { font-family: var(--font-display); font-weight: 900; text-transform: uppercase; line-height: 0.86; margin: 8px 0 14px; font-size: clamp(54px, 9vw, 112px); letter-spacing: 0.005em; color: var(--chalk); text-shadow: 0 4px 0 var(--ink), 0 10px 30px rgba(0,0,0,.4); }
#title h1 .amp { color: var(--signal); display: block; }
#title .tag { font-size: 18px; line-height: 1.5; color: var(--chalk); max-width: 46ch; margin: 0 0 22px; text-shadow: 0 1px 3px var(--ink); }
#title .menu { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
#title .menu .btn { font-size: 17px; padding: 12px 22px; min-width: 240px; text-align: left; }
#title .menu .btn.primary { font-family: var(--font-display); font-size: 28px; font-weight: 900; letter-spacing: .03em; text-transform: uppercase; padding: 8px 22px; }
#title .foot { margin-top: 26px; }
.spec { font-family: var(--font-mono); font-size: 11px; color: var(--muted); letter-spacing: .08em; }

/* confetti flash overlay */
#flash { position: fixed; inset: 0; pointer-events: none; z-index: 22; background: radial-gradient(circle at 50% 40%, rgba(255,214,120,.35), rgba(255,214,120,0) 60%); opacity: 0; transition: opacity .6s; }
#flash.on { opacity: 1; transition: none; }

@media (max-width: 860px) {
  .workorder { left: max(16px, env(safe-area-inset-left, 0px)); transform: none; top: calc(64px + env(safe-area-inset-top, 0px)); max-width: calc(100vw - 32px); min-width: 0; padding: 8px 12px; }
  .top-left { max-width: calc(100vw - 200px); }
  .brand { font-size: 14px; white-space: nowrap; }
  .level-name { font-size: 11px; }
  .bin { top: auto; left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); width: auto; bottom: calc(150px + env(safe-area-inset-bottom, 0px)); height: 112px; padding: 6px 8px; }
  .bin-head { display: none; }
  .bin-list { grid-template-columns: none; grid-auto-flow: column; grid-auto-columns: 84px; overflow-x: auto; overflow-y: hidden; height: 100%; }
  .bin-cat { display: none; }
  .card img { width: 52px; height: 52px; }
  .card .nm { font-size: 11px; min-height: 0; }
  .dock { left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); transform: none; flex-wrap: wrap; justify-content: center; gap: 6px; }
  .tools { flex-wrap: wrap; justify-content: center; }
  .tool { min-width: 50px; padding: 4px 6px; }
  .tool kbd { display: none; }
  .run-btn { min-width: 0; flex: 1; font-size: 22px; padding: 8px 12px; }
  .status { display: none; }
  .modal h2 { font-size: 36px; }
  #title { background: linear-gradient(180deg, rgba(9,22,41,0.88) 0%, rgba(9,22,41,0.65) 60%, rgba(9,22,41,0.3) 100%); }
  #tip { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}
</style>

<canvas id="scene" tabindex="0" aria-label="3D workbench"></canvas>

<div id="hud" hidden>
  <div class="top-left">
    <button class="brand" id="brandBtn" title="Main menu">The Improbable <span>Apparatus</span></button>
    <div class="level-name" id="levelName"></div>
  </div>

  <div class="workorder paper" id="workorder">
    <div class="eyebrow"><span>Work order</span><span id="woStatus">Not yet running</span></div>
    <ul class="goals" id="goals"></ul>
  </div>

  <div class="top-right">
    <button class="icon-btn paper" id="levelsBtn" title="Puzzles" aria-label="Puzzles">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
    </button>
    <button class="icon-btn paper" id="soundBtn" title="Sound on/off" aria-label="Sound on or off">
      <svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path class="wave" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/><path class="mute" d="M17 9l5 6M22 9l-5 6"/></svg>
    </button>
    <button class="icon-btn paper" id="helpBtn" title="How to play" aria-label="How to play">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.3a2.6 2.6 0 0 1 5 .9c0 1.7-2.5 2.2-2.5 3.8"/><path d="M12 17.2v.1"/></svg>
    </button>
  </div>

  <aside class="bin paper" id="bin" aria-label="Parts bin">
    <div class="bin-head"><span class="stencil">Parts bin</span><span class="eyebrow" id="binCount"></span></div>
    <div class="bin-list" id="binList"></div>
  </aside>

  <div class="status" id="status"></div>

  <div class="dock paper" id="dock">
    <div class="tools">
      <button class="tool" id="rotBtn" title="Rotate (R)"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg><span>Rotate</span><kbd>R</kbd></button>
      <button class="tool" id="upBtn" title="Raise (E)"><svg viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg><span>Raise</span><kbd>E</kbd></button>
      <button class="tool" id="downBtn" title="Lower (Q)"><svg viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6"/></svg><span>Lower</span><kbd>Q</kbd></button>
      <button class="tool" id="wireBtn" title="Wire colour (C)"><div class="chdot" id="wireDot"></div><span>Wire</span><kbd>C</kbd></button>

{

    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",

<script type="module">
// ============================================================================
//  THE IMPROBABLE APPARATUS — a 3D chain-reaction workshop
//  Core: imports, constants, helpers, audio synthesis, persistence
// ============================================================================
import * as THREE from 'three';
import * as CANNON from 'cannon-es';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const G = 15;                 // gravity (cells / s^2) — a little brisk, feels toy-like
const DT = 1 / 240;           // fixed physics step: deterministic & tunnel-proof
const MAX_RUN_TIME = 90;      // seconds of machine time before we stop caring
const TAU = Math.PI * 2;
const CHANNELS = ['red', 'blue', 'green', 'yellow'];
const CH_HEX = { red: 0xe5483b, blue: 0x2e7fe0, green: 0x2fae58, yellow: 0xf3c331 };
const CH_CSS = { red: '#e5483b', blue: '#2e7fe0', green: '#2fae58', yellow: '#f3c331' };
const CH_LABEL = { red: 'Red', blue: 'Blue', green: 'Green', yellow: 'Yellow' };

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = t => t * t * (3 - 2 * t);
const $ = sel => document.querySelector(sel);
const $$ = sel => Array.from(document.querySelectorAll(sel));

// Rotate a local (x,z) offset by r quarter turns, matching THREE rotation.y = r*PI/2
function rotXZ(x, z, r) {
  switch (((r % 4) + 4) % 4) {
    case 0: return [x, z];
    case 1: return [z, -x];
    case 2: return [-x, -z];
    default: return [-z, x];
  }
}

// Small deterministic RNG (mulberry32) for procedural textures & cosmetic jitter
function rng(seed) {
  let a = seed >>> 0;
  return () => {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const store = {
  get(key, fallback) {
    try { const v = localStorage.getItem('improbable.' + key); return v == null ? fallback : JSON.parse(v); }
    catch (e) { return fallback; }
  },
  set(key, value) {
    try { localStorage.setItem('improbable.' + key, JSON.stringify(value)); } catch (e) { /* storage unavailable */ }
  }
};

// ----------------------------------------------------------------------------
//  Audio: everything is synthesised on the fly with WebAudio — no samples.
// ----------------------------------------------------------------------------
const Sound = (() => {
  let ctx = null, master = null, noiseBuf = null;
  let muted = store.get('muted', false);
  let lastHit = 0, hitBudget = 0;
  let hum = null;

  function ensure() {
    if (!ctx) {
      try {
        ctx = new (window.AudioContext || window.webkitAudioContext)();
        const comp = ctx.createDynamicsCompressor();
        comp.threshold.value = -16; comp.ratio.value = 4; comp.attack.value = 0.003; comp.release.value = 0.2;
        master = ctx.createGain();
        master.gain.value = muted ? 0 : 0.55;
        master.connect(comp); comp.connect(ctx.destination);
        const len = ctx.sampleRate;
        noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
        const d = noiseBuf.getChannelData(0);
        const r = rng(7);
        for (let i = 0; i < len; i++) d[i] = r() * 2 - 1;
      } catch (e) { ctx = null; }
    }
    if (ctx && ctx.state === 'suspended') ctx.resume();
    return ctx;
  }

  function tone({ f = 440, f2 = null, type = 'sine', dur = 0.2, vol = 0.25, attack = 0.003, delay = 0, q = null, lp = null }) {
    if (!ctx || muted) return;
    const t0 = ctx.currentTime + delay;
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f, t0);
    if (f2) o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    let node = o;
    if (lp) { const fl = ctx.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = lp; if (q) fl.Q.value = q; o.connect(fl); node = fl; }
    node.connect(g); g.connect(master);
    o.start(t0); o.stop(t0 + dur + 0.05);
  }

  function noise({ dur = 0.1, vol = 0.2, f = 1000, f2 = null, q = 1, type = 'bandpass', delay = 0, attack = 0.002 }) {
    if (!ctx || muted) return;
    const t0 = ctx.currentTime + delay;
    const src = ctx.createBufferSource();
    src.buffer = noiseBuf;
    src.playbackRate.value = 0.7 + Math.random() * 0.6;
    const fl = ctx.createBiquadFilter();
    fl.type = type; fl.frequency.setValueAtTime(f, t0); fl.Q.value = q;
    if (f2) fl.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(fl); fl.connect(g); g.connect(master);
    src.start(t0, Math.random() * 0.5); src.stop(t0 + dur + 0.05);
  }

  const api = {
    unlock() { ensure(); },
    get muted() { return muted; },
    setMuted(m) {
      muted = m; store.set('muted', m);
      if (master) master.gain.setTargetAtTime(m ? 0 : 0.55, ctx.currentTime, 0.02);
      if (m) api.setHum(0);
    },
    click() { if (!ensure()) return; tone({ f: 1800, f2: 900, type: 'triangle', dur: 0.05, vol: 0.12 }); },
    hover() { if (!ensure()) return; tone({ f: 2400, type: 'sine', dur: 0.03, vol: 0.03 }); },
    pickup() { if (!ensure()) return; tone({ f: 300, f2: 620, type: 'triangle', dur: 0.12, vol: 0.18 }); },
    place() {
      if (!ensure()) return;
      noise({ dur: 0.08, vol: 0.35, f: 900, q: 2 });
      tone({ f: 180, f2: 90, type: 'sine', dur: 0.12, vol: 0.3 });
    },
    rotate() { if (!ensure()) return; tone({ f: 1200, f2: 1500, type: 'square', dur: 0.04, vol: 0.05, lp: 3000 }); },
    nope() { if (!ensure()) return; tone({ f: 220, f2: 160, type: 'sawtooth', dur: 0.16, vol: 0.12, lp: 900 }); },
    remove() { if (!ensure()) return; tone({ f: 600, f2: 200, type: 'triangle', dur: 0.15, vol: 0.15 }); },
    start() {
      if (!ensure()) return;
      [392, 523, 659].forEach((f, i) => tone({ f, type: 'triangle', dur: 0.18, vol: 0.14, delay: i * 0.06 }));
      noise({ dur: 0.4, vol: 0.06, f: 400, f2: 3000, q: 0.8 });
    },
    reset() { if (!ensure()) return; [659, 523, 392].forEach((f, i) => tone({ f, type: 'triangle', dur: 0.12, vol: 0.1, delay: i * 0.05 })); },
    // Physical impacts — pitched and filtered by material, scaled by impact speed
    hit(mat, speed) {
      if (!ctx || muted) return;
      const now = performance.now();
      if (now - lastHit > 60) { hitBudget = 0; lastHit = now; }
      if (hitBudget++ > 6) return;
      const v = clamp((speed - 0.6) / 7, 0.02, 1);
      const vol = 0.05 + v * 0.4;
      switch (mat) {
        case 'metal':
          tone({ f: 1700 + Math.random() * 600, type: 'sine', dur: 0.25, vol: vol * 0.35 });
          tone({ f: 4300 + Math.random() * 900, type: 'sine', dur: 0.12, vol: vol * 0.15 });
          noise({ dur: 0.03, vol: vol * 0.4, f: 5000, q: 3 });
          break;
        case 'rubber':
          tone({ f: 220 + v * 120, f2: 120, type: 'sine', dur: 0.12, vol: vol * 0.6 });
          break;
        case 'domino':
          noise({ dur: 0.035, vol: vol * 0.7, f: 2600 + Math.random() * 800, q: 6 });
          tone({ f: 1100 + Math.random() * 300, type: 'triangle', dur: 0.04, vol: vol * 0.2 });
          break;
        case 'soft':
          noise({ dur: 0.08, vol: vol * 0.3, f: 500, q: 0.7, type: 'lowpass' });
          break;
        case 'heavy':
          tone({ f: 90, f2: 45, type: 'sine', dur: 0.25, vol: vol * 0.9 });
          noise({ dur: 0.1, vol: vol * 0.5, f: 400, q: 1 });
          break;
        default: // wood
          noise({ dur: 0.06, vol: vol * 0.6, f: 700 + Math.random() * 500, q: 4 });
          tone({ f: 260 + Math.random() * 120, f2: 140, type: 'triangle', dur: 0.08, vol: vol * 0.35 });
      }
    },
    bell() {
      if (!ensure()) return;
      const base = 880;
      [[1, 0.3, 2.2], [2.76, 0.12, 1.4], [5.4, 0.06, 0.8], [8.93, 0.04, 0.5], [0.5, 0.08, 1.8]].forEach(([m, v, d]) =>
        tone({ f: base * m, type: 'sine', dur: d, vol: v, attack: 0.002 }));
    },
    pop() {
      if (!ensure()) return;
      noise({ dur: 0.12, vol: 0.7, f: 1800, q: 0.6, type: 'highpass' });
      tone({ f: 120, f2: 50, type: 'sine', dur: 0.1, vol: 0.4 });
    },
    boing() {
      if (!ensure()) return;
      tone({ f: 140, f2: 520, type: 'sine', dur: 0.22, vol: 0.28 });
      tone({ f: 280, f2: 1040, type: 'triangle', dur: 0.15, vol: 0.06 });
    },
    bumper() {
      if (!ensure()) return;
      tone({ f: 660, f2: 990, type: 'square', dur: 0.09, vol: 0.12, lp: 2500 });
      tone({ f: 1320, type: 'sine', dur: 0.2, vol: 0.08, delay: 0.03 });
    },
    press() {
      if (!ensure()) return;
      tone({ f: 900, type: 'square', dur: 0.05, vol: 0.08, lp: 2000 });
      tone({ f: 1350, type: 'sine', dur: 0.25, vol: 0.12, delay: 0.05 });
    },
    whoosh() { if (!ensure()) return; noise({ dur: 0.35, vol: 0.3, f: 300, f2: 2400, q: 1.2 }); },
    thunk() {
      if (!ensure()) return;
      tone({ f: 140, f2: 60, type: 'sine', dur: 0.18, vol: 0.5 });
      noise({ dur: 0.06, vol: 0.4, f: 1200, q: 1.5 });
    },
    zap() {
      if (!ensure()) return;
      tone({ f: 80, f2: 2000, type: 'sawtooth', dur: 0.18, vol: 0.06, lp: 4000 });
      tone({ f: 1046, type: 'sine', dur: 0.3, vol: 0.1, delay: 0.08 });
    },
    goal() {
      if (!ensure()) return;
      [784, 988, 1175].forEach((f, i) => tone({ f, type: 'triangle', dur: 0.22, vol: 0.14, delay: i * 0.07 }));
    },
    win() {
      if (!ensure()) return;
      const notes = [523, 659, 784, 1046, 784, 1046, 1318];
      notes.forEach((f, i) => {
        tone({ f, type: 'triangle', dur: 0.32, vol: 0.16, delay: i * 0.1 });
        tone({ f: f / 2, type: 'sine', dur: 0.32, vol: 0.1, delay: i * 0.1 });
      });
      noise({ dur: 0.9, vol: 0.08, f: 6000, q: 0.5, type: 'highpass', delay: 0.5 });
    },
    // Continuous whirr for fans & belts while they run
    setHum(level) {
      if (!ctx || muted) { if (hum) { hum.g.gain.setTargetAtTime(0, ctx ? ctx.currentTime : 0, 0.05); } return; }
      if (!hum && level > 0) {
        const src = ctx.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
        const fl = ctx.createBiquadFilter(); fl.type = 'bandpass'; fl.frequency.value = 340; fl.Q.value = 0.9;
        const o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = 72;
        const og = ctx.createGain(); og.gain.value = 0.04;
        const lfo = ctx.createBiquadFilter(); lfo.type = 'lowpass'; lfo.frequency.value = 300;
        const g = ctx.createGain(); g.gain.value = 0;
        src.connect(fl); fl.connect(g); o.connect(lfo); lfo.connect(og); og.connect(g); g.connect(master);
        src.start(); o.start();
        hum = { g };
      }
      if (hum) hum.g.gain.setTargetAtTime(clamp(level, 0, 1) * 0.16, ctx.currentTime, 0.12);
    }
  };
  return api;
})();

// ============================================================================
//  Rendering: renderer, workshop scene, procedural textures, materials, FX
// ============================================================================
const canvas = document.getElementById('scene');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance', preserveDrawingBuffer: false });
} catch (e) {
  const msg = document.createElement('div');
  msg.style.cssText = 'position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center;font:600 18px/1.5 var(--font-body);color:var(--chalk);background:var(--ink)';
  msg.textContent = 'The Improbable Apparatus needs WebGL, and this browser could not start it. Try another browser, or turn on hardware acceleration.';
  document.body.appendChild(msg);
  throw e;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
const BG = 0x101b2f;
scene.background = new THREE.Color(BG);
scene.fog = new THREE.Fog(BG, 34, 80);
{
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;
  pmrem.dispose();
}

const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 220);
camera.position.set(8, 9, 12);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.09;
controls.maxPolarAngle = Math.PI * 0.485;
controls.minDistance = 3.5;
controls.maxDistance = 46;
controls.screenSpacePanning = false;
controls.zoomSpeed = 0.9;
controls.rotateSpeed = 0.7;
controls.mouseButtons = { LEFT: THREE.MOUSE.ROTATE, MIDDLE: THREE.MOUSE.PAN, RIGHT: THREE.MOUSE.ROTATE };
controls.touches = { ONE: THREE.TOUCH.ROTATE, TWO: THREE.TOUCH.DOLLY_PAN };

// Lights: warm workshop key light from above (shadows fall almost straight down,
// which doubles as a depth cue while placing parts), cool fill, sky/ground bounce.
const hemi = new THREE.HemisphereLight(0xd6e6ff, 0x3a2a1c, 0.55);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffe4c0, 2.3);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.025;
scene.add(sun, sun.target);
const fill = new THREE.DirectionalLight(0x9db9ff, 0.45);
fill.position.set(12, 6, -10);
scene.add(fill);

// ----------------------------------------------------------------------------
//  Board coordinates. One cell = one world unit. Floor of the board is y = 0.
// ----------------------------------------------------------------------------
const BOARD = { w: 10, d: 6, h: 7 };
function cellToWorld(i, j, k, out = new THREE.Vector3()) {
  return out.set(i - BOARD.w / 2 + 0.5, j, k - BOARD.d / 2 + 0.5);
}
function inBoard(i, j, k) {
  return i >= 0 && k >= 0 && j >= 0 && i < BOARD.w && k < BOARD.d && j < BOARD.h;
}

// ----------------------------------------------------------------------------
//  Procedural textures
// ----------------------------------------------------------------------------
const MAX_ANISO = renderer.capabilities.getMaxAnisotropy();
function canvasTex(w, h, draw, opts = {}) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d');
  draw(g, w, h);
  const t = new THREE.CanvasTexture(c);
  if (opts.srgb !== false) t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = Math.min(8, MAX_ANISO);
  if (opts.repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(opts.repeat[0], opts.repeat[1]); }
  return t;
}

function woodTex(seed, base, dark, light, opts = {}) {
  const w = opts.w || 256, h = opts.h || 256;
  return canvasTex(w, h, (g) => {
    const r = rng(seed);
    g.fillStyle = base; g.fillRect(0, 0, w, h);
    // broad tone variation
    for (let i = 0; i < 6; i++) {
      g.fillStyle = r() < 0.5 ? dark : light;
      g.globalAlpha = 0.05 + r() * 0.06;
      g.fillRect(0, r() * h, w, 10 + r() * 40);
    }
    // grain
    const lines = opts.lines || 46;
    for (let i = 0; i < lines; i++) {
      const y0 = r() * h, amp = 1 + r() * 5, fq = 0.008 + r() * 0.03, ph = r() * 10;
      g.strokeStyle = r() < 0.65 ? dark : light;
      g.globalAlpha = 0.07 + r() * 0.2;
      g.lineWidth = 0.5 + r() * 2;
      g.beginPath();
      for (let x = 0; x <= w; x += 4) {
        const y = y0 + Math.sin(x * fq + ph) * amp + Math.sin(x * 0.11 + ph * 3) * 0.5;
        if (x === 0) g.moveTo(x, y); else g.lineTo(x, y);
      }
      g.stroke();
    }
    // a knot or two
    for (let k = 0; k < (opts.knots ?? 1); k++) {
      const kx = r() * w, ky = r() * h;
      for (let i = 6; i > 0; i--) {
        g.globalAlpha = 0.08; g.strokeStyle = dark; g.lineWidth = 1.2;
        g.beginPath(); g.ellipse(kx, ky, i * 3.2, i * 1.3, 0, 0, TAU); g.stroke();
      }
    }
    if (opts.planks) {
      g.globalAlpha = 0.5; g.fillStyle = dark;
      for (let i = 1; i < opts.planks; i++) g.fillRect(0, (i * h) / opts.planks - 1, w, 2);
    }
    g.globalAlpha = 1;
  }, opts);
}

// The board: a green self-healing cutting mat with a ruled margin (one tick per tenth of a cell)
function matTexture(W, D) {
  const S = 64, M = 0.6; // px per cell, margin in cells
  const pw = Math.round((W + M * 2) * S), ph = Math.round((D + M * 2) * S);
  return canvasTex(pw, ph, (g) => {
    g.fillStyle = '#2d6a59'; g.fillRect(0, 0, pw, ph);
    const r = rng(11);
    for (let i = 0; i < 2600; i++) { // speckle
      g.fillStyle = r() < 0.5 ? 'rgba(255,255,255,0.025)' : 'rgba(0,0,0,0.05)';
      g.fillRect(r() * pw, r() * ph, 2, 2);
    }
    const ox = M * S, oy = M * S;
    // diagonal 45° guides
    g.strokeStyle = 'rgba(190,235,215,0.10)'; g.lineWidth = 1;
    for (let i = -D; i < W; i += 2) {
      g.beginPath(); g.moveTo(ox + i * S, oy); g.lineTo(ox + (i + D) * S, oy + D * S); g.stroke();
    }
    // cell grid
    for (let i = 0; i <= W; i++) {
      g.strokeStyle = i % 5 === 0 ? 'rgba(235,250,240,0.55)' : 'rgba(200,240,220,0.28)';
      g.lineWidth = i % 5 === 0 ? 2 : 1.2;
      g.beginPath(); g.moveTo(ox + i * S, oy); g.lineTo(ox + i * S, oy + D * S); g.stroke();
    }
    for (let k = 0; k <= D; k++) {
      g.strokeStyle = k % 5 === 0 ? 'rgba(235,250,240,0.55)' : 'rgba(200,240,220,0.28)';
      g.lineWidth = k % 5 === 0 ? 2 : 1.2;
      g.beginPath(); g.moveTo(ox, oy + k * S); g.lineTo(ox + W * S, oy + k * S); g.stroke();
    }
    // ruler ticks in the margin
    g.strokeStyle = 'rgba(245,230,140,0.75)'; g.fillStyle = 'rgba(245,230,140,0.85)';
    g.font = '600 15px "IBM Plex Mono", monospace'; g.textAlign = 'center'; g.textBaseline = 'middle';
    for (let t = 0; t <= W * 10; t++) {
      const x = ox + (t / 10) * S, len = t % 10 === 0 ? 14 : t % 5 === 0 ? 9 : 5;
      g.lineWidth = t % 10 === 0 ? 2 : 1;
      g.beginPath(); g.moveTo(x, oy - 2); g.lineTo(x, oy - 2 - len); g.stroke();
      g.beginPath(); g.moveTo(x, oy + D * S + 2); g.lineTo(x, oy + D * S + 2 + len); g.stroke();

      g.beginPath(); g.moveTo(ox - 2, y); g.lineTo(ox - 2 - len, y); g.stroke();

const gBox = (w, h, d) => cachedGeo(`b${w},${h},${d}`, () => new THREE.BoxGeometry(w, h, d));
const gRBox = (w, h, d, r = 0.04) => cachedGeo(`rb${w},${h},${d},${r}`, () => new RoundedBoxGeometry(w, h, d, 2, Math.min(r, w / 2, h / 2, d / 2)));

const gTorus = (r, t, rs = 12, ts = 32, arc = TAU) => cachedGeo(`t${r},${t},${arc}`, () => new THREE.TorusGeometry(r, t, rs, ts, arc));

function mk(geo, mat, x = 0, y = 0, z = 0, o = {}) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  if (o.rx) m.rotation.x = o.rx;
  if (o.ry) m.rotation.y = o.ry;
  if (o.rz) m.rotation.z = o.rz;
  if (o.s) m.scale.setScalar(o.s);
  m.castShadow = o.cast !== false;
  m.receiveShadow = o.recv !== false;
  return m;
}
function group(...children) { const g = new THREE.Group(); children.forEach(c => c && g.add(c)); return g; }

// ----------------------------------------------------------------------------
//  Particle FX — pooled instanced quads (confetti) and blobs (sparks & puffs)
// ----------------------------------------------------------------------------
const FX = (() => {
  const N = 600;
  const confGeo = new THREE.PlaneGeometry(0.13, 0.08);
  const confMat = new THREE.MeshStandardMaterial({ side: THREE.DoubleSide, roughness: 0.6, envMapIntensity: 0.5 });
  const conf = new THREE.InstancedMesh(confGeo, confMat, N);
  const blobGeo = new THREE.IcosahedronGeometry(0.06, 0);
  const blobMat = new THREE.MeshBasicMaterial({ transparent: true, opacity: 0.9, depthWrite: false });
  const blob = new THREE.InstancedMesh(blobGeo, blobMat, N);
  conf.frustumCulled = blob.frustumCulled = false;
  const color = new THREE.Color();
  for (let i = 0; i < N; i++) { conf.setColorAt(i, color.set(0xffffff)); blob.setColorAt(i, color.set(0xffffff)); }
  const parts = [];
  const dummy = new THREE.Object3D();
  const zero = new THREE.Matrix4().makeScale(0, 0, 0);
  for (let i = 0; i < N; i++) { conf.setMatrixAt(i, zero); blob.setMatrixAt(i, zero); }
  scene.add(conf, blob);
  let nextC = 0, nextB = 0;
  function spawn(kind, pos, o) {
    const isConf = kind === 'confetti';
    const idx = isConf ? (nextC = (nextC + 1) % N) : (nextB = (nextB + 1) % N);
    const sp = o.speed ?? 3;
    const dir = new THREE.Vector3(Math.random() - 0.5, Math.random() * (o.up ?? 1), Math.random() - 0.5).normalize();
    const p = {
      kind, idx, isConf,
      pos: pos.clone().add(new THREE.Vector3((Math.random() - 0.5) * (o.spread ?? 0.1), (Math.random() - 0.5) * (o.spread ?? 0.1), (Math.random() - 0.5) * (o.spread ?? 0.1))),
      vel: dir.multiplyScalar(sp * (0.4 + Math.random() * 0.8)).add(o.vel || new THREE.Vector3()),
      rot: new THREE.Euler(Math.random() * 6, Math.random() * 6, Math.random() * 6),
      spin: new THREE.Vector3((Math.random() - 0.5) * 14, (Math.random() - 0.5) * 14, (Math.random() - 0.5) * 14),
      life: 0, max: (o.life ?? 1) * (0.6 + Math.random() * 0.6), g: o.gravity ?? 9, drag: o.drag ?? 0.5,
      size: (o.size ?? 1) * (0.6 + Math.random() * 0.7), grow: o.grow ?? 0
    };
    const cols = o.colors || [0xffffff];
    (isConf ? conf : blob).setColorAt(idx, color.set(cols[(Math.random() * cols.length) | 0]));
    (isConf ? conf : blob).instanceColor.needsUpdate = true;
    parts.push(p);
  }
  return {
    burst(kind, pos, count, o = {}) { for (let i = 0; i < count; i++) spawn(kind, pos, o); },
    clear() { for (const p of parts) (p.isConf ? conf : blob).setMatrixAt(p.idx, zero); parts.length = 0; conf.instanceMatrix.needsUpdate = blob.instanceMatrix.needsUpdate = true; },
    update(dt) {
      if (!parts.length) return;
      for (let i = parts.length - 1; i >= 0; i--) {
        const p = parts[i];
        p.life += dt;
        const mesh = p.isConf ? conf : blob;
        if (p.life >= p.max) { mesh.setMatrixAt(p.idx, zero); parts.splice(i, 1); continue; }
        p.vel.y -= p.g * dt;
        p.vel.multiplyScalar(Math.pow(1 - Math.min(0.99, p.drag), dt));
        if (p.isConf) { p.vel.x += Math.sin(p.life * 7 + p.idx) * dt * 2; }
        p.pos.addScaledVector(p.vel, dt);
        if (p.pos.y < 0.02 && p.isConf) { p.pos.y = 0.02; p.vel.set(0, 0, 0); p.spin.multiplyScalar(0.9); }
        p.rot.x += p.spin.x * dt; p.rot.y += p.spin.y * dt; p.rot.z += p.spin.z * dt;
        const t = p.life / p.max;
        const s = p.size * (p.isConf ? 1 : (1 + p.grow * t) * (1 - t * t));
        dummy.position.copy(p.pos); dummy.rotation.copy(p.rot); dummy.scale.setScalar(Math.max(0.0001, s));
        dummy.updateMatrix();
        mesh.setMatrixAt(p.idx, dummy.matrix);
      }
      conf.instanceMatrix.needsUpdate = true; blob.instanceMatrix.needsUpdate = true;
    }
  };
})();

// ============================================================================
//  Parts catalogue — every gadget's look (THREE) and behaviour (cannon-es).
//  Local frame: origin at the anchor cell's bottom-centre, +x = "forward".
// ============================================================================
const PARTS = {};
const PART_ORDER = [];
function defPart(id, def) {
  def.id = id;
  def.cells = def.cells || [[0, 0, 0]];
  PARTS[id] = def;
  PART_ORDER.push(id);
}

let INST_SEQ = 1;
class Inst {
  constructor(type, i, j, k, r = 0, o = {}) {
    this.type = type;
    this.def = PARTS[type];
    if (!this.def) throw new Error('Unknown part ' + type);
    this.i = i; this.j = j; this.k = k;
    this.r = ((r % 4) + 4) % 4;
    this.fixed = !!o.fixed;
    this.id = o.id || type + '#' + INST_SEQ++;
    this.ch = o.ch !== undefined ? o.ch : (this.def.defaultCh ?? null);
    this.v = {}; // named visual children
    this.group = this.def.build(this);
    this.group.traverse(m => { m.userData.inst = this; });
    this.place();
  }
  cells() {
    return this.def.cells.map(([x, y, z]) => { const [dx, dz] = rotXZ(x, z, this.r); return [this.i + dx, this.j + y, this.k + dz]; });
  }
  base(out = new THREE.Vector3()) { return cellToWorld(this.i, this.j, this.k, out); }
  local(x, y, z, out = new THREE.Vector3()) {
    const [dx, dz] = rotXZ(x, z, this.r);
    this.base(out); out.x += dx; out.y += y; out.z += dz; return out;
  }
  dir(x, z) { const [dx, dz] = rotXZ(x, z, this.r); return new THREE.Vector3(dx, 0, dz); }
  place() {
    const c = this.def.center || [0, 0, 0];
    this.local(c[0], c[1], c[2], this.group.position);
    this.group.rotation.set(0, this.r * Math.PI / 2, 0);
    this.group.visible = true;
    if (this.def.reset) this.def.reset(this);
  }
  // world (cannon) point -> this part's local frame (for animating children of a static group)
  toLocal(p, out = new THREE.Vector3()) {
    const b = this.base();
    const [x, z] = rotXZ(p.x - b.x, p.z - b.z, 4 - this.r);
    return out.set(x, p.y - b.y, z);
  }
  setChannel(ch) {
    this.ch = ch;
    if (this.def.paintChannel) this.def.paintChannel(this);
  }
}

// ---- cannon quaternion helpers ---------------------------------------------
const AX = { x: new CANNON.Vec3(1, 0, 0), y: new CANNON.Vec3(0, 1, 0), z: new CANNON.Vec3(0, 0, 1) };
function cq(axis, ang) { const q = new CANNON.Quaternion(); q.setFromAxisAngle(AX[axis], ang); return q; }
const V3 = (x, y, z) => new CANNON.Vec3(x, y, z);
const BOX = (x, y, z) => new CANNON.Box(new CANNON.Vec3(x, y, z));

// Painted alphabet faces for the toy blocks
const LETTER_MATS = [];
function letterMat(n) {
  if (!LETTER_MATS.length) {
    const letters = ['A', 'B', 'C', 'D', 'E', 'F'];
    const cols = ['#d6412f', '#2c6dd1', '#379a55', '#e89b1c', '#8a4fc7', '#1f9aa0'];
    letters.forEach((L, idx) => {
      const t = canvasTex(128, 128, (g, w, h) => {
        g.drawImage(TEX.woodLight.image, 0, 0, w, h);
        g.strokeStyle = cols[idx]; g.lineWidth = 9; g.strokeRect(9, 9, w - 18, h - 18);
        g.fillStyle = cols[idx]; g.font = '900 78px "Big Shoulders Stencil Display", Impact, sans-serif';
        g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(L, w / 2, h / 2 + 4);
      });
      LETTER_MATS.push(std({ map: t, roughness: 0.68 }));
    });
  }
  return LETTER_MATS[n % LETTER_MATS.length];
}
function hashId(s) { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return Math.abs(h); }

function prismGeo(points, depth) {
  const shape = new THREE.Shape(points.map(p => new THREE.Vector2(p[0], p[1])));
  const g = new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: false });
  g.translate(0, 0, -depth / 2);
  return g;
}

const RAMP_A = Math.atan2(1, 2), RAMP_L = Math.sqrt(5);

const CURVE_R = 0.72;
defPart('curve', {
  name: 'Curved Rail', cat: 'Structure',
  desc: 'Turns a rolling ball through 90°. Works in either direction.',
  build() {
    const g = new THREE.Group();
    g.add(mk(gBox(1, 0.05, 1), MAT.plank, 0, -0.022, 0));
    const wallGeo = cachedGeo('curvewall', () => new THREE.CylinderGeometry(CURVE_R + 0.03, CURVE_R + 0.03, 0.34, 18, 1, true, Math.PI / 2, Math.PI / 2));
    const wallMat = cachedGeo('curvewallmat', () => { const m = MAT.brass.clone(); m.side = THREE.DoubleSide; return m; });
    g.add(mk(wallGeo, wallMat, -0.5, 0.17, 0.5));
    const rimGeo = cachedGeo('curverim', () => new THREE.TorusGeometry(CURVE_R + 0.03, 0.025, 6, 18, Math.PI / 2));
    const rim = mk(rimGeo, MAT.brass, -0.5, 0.34, 0.5, { rx: Math.PI / 2 });
    rim.rotation.z = -Math.PI / 2; // arc from +x around to -z
    g.add(rim);
    return g;
  },
  physics(inst, sim) {
    const list = [{ s: BOX(0.5, 0.04, 0.5), p: [0, -0.04, 0], m: 'wood' }];
    const n = 7;
    for (let s = 0; s < n; s++) {
      const t0 = -Math.PI / 2 + (s / n) * (Math.PI / 2), t1 = -Math.PI / 2 + ((s + 1) / n) * (Math.PI / 2);
      const tm = (t0 + t1) / 2, rr = CURVE_R + 0.03;
      const len = rr * (t1 - t0) * 1.12;
      const cx = -0.5 + rr * Math.cos(tm), cz = 0.5 + rr * Math.sin(tm);
      const phi = Math.atan2(-Math.cos(tm), -Math.sin(tm));
      list.push({ s: BOX(len / 2, 0.17, 0.03), p: [cx, 0.17, cz], q: cq('y', phi), m: 'slick' });
    }
    sim.staticBody(inst, list, 'wood');
    // Rail guidance: while a ball rides the wall, keep its velocity tangent to the arc so it
    // leaves square to the exit face instead of skidding off at an angle.
    const C = inst.local(-0.5, 0, 0.5);
    const steer = (other) => {
      const d = other.userData?.dyn; if (!d || !d.roll) return;
      const v = other.velocity, p = other.position;
      let tx = -(p.z - C.z), tz = p.x - C.x;
      const L = Math.hypot(tx, tz) || 1; tx /= L; tz /= L;
      if (tx * v.x + tz * v.z < 0) { tx = -tx; tz = -tz; }
      const sp = Math.hypot(v.x, v.z);
      v.x = tx * sp; v.z = tz * sp;
      const r = d.radius || 0.2; // spin to match, or old spin would skid it sideways later
      other.angularVelocity.set(v.z / r, 0, -v.x / r);
    };
    for (let n = 1; n < list.length; n++) list[n].s.onTouch = steer;
  }
});

defPart('funnel', {
  name: 'Funnel', cat: 'Structure',
  desc: 'Catches anything that falls in and drops it out of the bottom, dead centre. Beach balls are too big to fit.',
  build() {
    const g = new THREE.Group();
    const m = cachedGeo('funnelmat', () => { const mm = MAT.copper.clone(); mm.side = THREE.DoubleSide; return mm; });
    g.add(mk(gCyl(0.48 * Math.SQRT2, 0.27 * Math.SQRT2, 0.5, 4, true), m, 0, 0.75, 0, { ry: Math.PI / 4 }));
    g.add(mk(gCyl(0.29 * Math.SQRT2, 0.29 * Math.SQRT2, 0.2, 4, true), m, 0, 0.4, 0, { ry: Math.PI / 4 }));
    g.add(mk(gCyl(0.5 * Math.SQRT2, 0.5 * Math.SQRT2, 0.04, 4, true), MAT.brass, 0, 0.99, 0, { ry: Math.PI / 4 }));
    return g;
  },
  physics(inst, sim) {
    const list = [];
    const beta = Math.atan2(0.21, 0.5), half = Math.hypot(0.21, 0.5) / 2;
    for (let s = 0; s < 4; s++) {
      const a = s * Math.PI / 2;
      const q = cq('y', a).mult(cq('z', -beta));
      const [px, pz] = rotXZ(0.375 + 0.03, 0, s);
      list.push({ s: BOX(0.02, half + 0.03, 0.5), p: [px, 0.75, pz], q, m: 'metal' });
      const [tx, tz] = rotXZ(0.29, 0, s);
      list.push({ s: BOX(0.02, 0.1, 0.31), p: [tx, 0.4, tz], q: cq('y', a), m: 'metal' });
    }
    sim.staticBody(inst, list, 'metal');
    // The throat squares things up: anything passing through leaves centred and falling straight.
    const c = inst.base();
    sim.addActor({
      post() {
        for (const d of sim.dyn) {
          if (d.gone) continue;
          const p = d.body.position;
          const dx = p.x - c.x, dz = p.z - c.z, dy = p.y - c.y;
          if (dy < 0.05 || dy > 0.62 || Math.abs(dx) > 0.3 || Math.abs(dz) > 0.3) continue;
          const v = d.body.velocity;
          v.x *= 0.5; v.z *= 0.5;
          p.x -= dx * 0.25; p.z -= dz * 0.25;
          d.body.angularVelocity.scale(0.5, d.body.angularVelocity);
        }
      }
    });
  }
});

    sim.addActor({ fx(dt) { inst.dip = Math.max(0, (inst.dip || 0) - dt * 4); inst.v.pad.position.y = 0.255 - Math.sin(inst.dip * Math.PI) * 0.06; } });
  }

defPart('bumper', {
  name: 'Kicker', cat: 'Bouncers', blocksWind: true,
  desc: 'A pinball kicker. Anything that touches it gets booted toward the arrow at speed, whichever way it came from.',
  build(inst) {
    const g = new THREE.Group();
    g.add(mk(gCyl(0.38, 0.42, 0.12, 28), MAT.darkMetal, 0, 0.06, 0));
    const ring = mk(gCyl(0.32, 0.32, 0.3, 28), std({ color: 0xff3d7f, roughness: 0.3, emissive: 0xff3d7f, emissiveIntensity: 0.1 }), 0, 0.27, 0);
    g.add(ring);
    g.add(mk(gCyl(0.35, 0.35, 0.06, 28), MAT.white, 0, 0.45, 0));
    const arrow = mk(prismGeo([[-0.12, -0.07], [0.04, -0.07], [0.04, -0.15], [0.24, 0], [0.04, 0.15], [0.04, 0.07], [-0.12, 0.07]], 0.04), MAT.yellow, 0, 0.5, 0, { rx: -Math.PI / 2 });
    g.add(arrow);
    inst.v.ring = ring;
    return g;
  },
  reset(inst) { inst.v.ring.material.emissiveIntensity = 0.1; inst.flash = 0; },
  physics(inst, sim) {
    const cyl = new CANNON.Cylinder(0.34, 0.4, 0.48, 16);
    sim.staticBody(inst, [{ s: cyl, p: [0, 0.24, 0] }], 'dead');
    const dir = inst.dir(1, 0);
    const center = inst.local(0, 0.24, 0);
    cyl.onTouch = (other) => {
      const d = other.userData?.dyn; if (!d || d.balloon) return;
      if (sim.time - (d.lastBump || -1) < 0.15) return;
      const sp = 6.5;
      // launch from just in front of the kicker so it never fights its way through the post
      const p = other.position;
      const ahead = (p.x - center.x) * dir.x + (p.z - center.z) * dir.z;
      if (ahead < 0.1) {
        const side = -(p.x - center.x) * dir.z + (p.z - center.z) * dir.x;
        const reach = 0.42 + (d.radius || 0.25);
        p.x = center.x + dir.x * reach - dir.z * side * 0.3;
        p.z = center.z + dir.z * reach + dir.x * side * 0.3;
        p.y = Math.max(p.y, center.y - 0.24 + (d.radius || 0.25));
      }
      other.velocity.set(dir.x * sp, Math.max(other.velocity.y, 1.2), dir.z * sp);
      other.angularVelocity.set(0, 0, 0);
      d.lastBump = sim.time;
      inst.flash = 1;
      sim.fx('bumper', other.position);
    };
    sim.addActor({ fx(dt) { inst.flash = Math.max(0, (inst.flash || 0) - dt * 5); inst.v.ring.material.emissiveIntensity = 0.1 + inst.flash * 1.6; } });
  }
});

defPart('domino', {
  name: 'Domino', cat: 'Objects', dynamic: true, cells: [[0, 0, 0], [0, 1, 0]], center: [0, 0.8, 0],
  desc: 'Stand them in a row one cell apart and topple the first one. Falls along its facing.',
  build() {
    const g = new THREE.Group();
    const m = MAT.dominoSide;
    g.add(mk(gBox(0.16, 1.6, 0.62), [MAT.domino, MAT.domino, m, m, m, m]));
    return g;
  },
  physics(inst, sim) {
    const shape = BOX(0.08, 0.8, 0.31);
    const d = sim.dynBody(inst, { shapes: [{ s: shape }], mass: 0.5, mat: 'domino', snd: 'domino', windArea: 0.9, linDamp: 0.02, angDamp: 0.05 });
    d.domino = true;
    // Topple assist: a falling domino always passes enough momentum on to the next one.
    // Pure rigid-body contact loses too much energy per hit for long chains to be reliable.
    shape.onTouch = (other) => {
      const od = other.userData?.dyn;
      if (!od || !od.domino) return;
      const b = d.body;
      if (dominoUp(b) > 0.97 || dominoUp(other) < 0.55) return; // I'm upright, or it's already down
      let dx = other.position.x - b.position.x, dz = other.position.z - b.position.z;
      const L = Math.hypot(dx, dz) || 1; dx /= L; dz /= L;
      const ax = dz, az = -dx; // axis = up × dir
      const w = other.angularVelocity;
      const along = w.x * ax + w.z * az;
      if (along < 2.4) { w.x += ax * (2.4 - along); w.z += az * (2.4 - along); }
      other.wakeUp();
    };
  }
});

defPart('seesaw', {

});
const SEESAW_TILT = 0.29; // ~17°, the -x end rests on its stop
const SEESAW_COM = 0.15; // centre of mass sits this far toward the resting end
function dominoUp(b) { const q = b.quaternion; return 1 - 2 * (q.x * q.x + q.z * q.z); }

defPart('conveyor', {
  name: 'Conveyor Belt', cat: 'Machines', cells: [[0, 0, 0], [1, 0, 0]], channel: 'device',
  desc: 'Carries whatever lands on it toward the arrow, and grips well enough to take things on from the side. Runs all the time unless it is wired to a coloured plate.',
  build(inst) {
    const g = new THREE.Group();
    const tex = TEX.belt.clone(); tex.needsUpdate = true;
    const beltMat = MAT.belt.clone(); beltMat.map = tex;
    inst.v.tex = tex;
    g.add(mk(gBox(2, 0.04, 0.86), beltMat, 0.5, 0.2, 0));
    g.add(mk(gBox(2, 0.14, 0.82), MAT.rubber, 0.5, 0.11, 0));
    for (const s of [-1, 1]) {
      g.add(mk(gBox(2.04, 0.2, 0.05), MAT.darkMetal, 0.5, 0.11, s * 0.455));
      g.add(mk(gBox(2.04, 0.02, 0.06), MAT.yellow, 0.5, 0.215, s * 0.455));
    }
    for (const x of [-0.45, 1.45]) g.add(mk(gCyl(0.1, 0.1, 0.86, 16), MAT.steel, x, 0.11, 0, { rx: Math.PI / 2 }));
    for (const x of [-0.3, 1.3]) for (const s of [-1, 1]) g.add(mk(gBox(0.08, 0.06, 0.08), MAT.darkMetal, x, 0.03, s * 0.42));
    // direction arrow + channel lamp
    const arrow = mk(prismGeo([[-0.25, 0.08], [0.15, 0.08], [0.15, 0.16], [0.4, 0], [0.15, -0.16], [0.15, -0.08], [-0.25, -0.08]], 0.02), MAT.yellow, 0.5, 0.225, 0, { rx: -Math.PI / 2, cast: false });
    g.add(arrow);
    const lamp = mk(gSphere(0.07, 12, 8), chMat(inst.ch), -0.45, 0.12, 0.49);
    g.add(lamp);
    inst.v.lamp = lamp;
    return g;
  },
  paintChannel(inst) { inst.v.lamp.material = chMat(inst.ch); },
  reset(inst) { inst.v.tex.offset.x = 0; },
  physics(inst, sim) {
    const belt = BOX(1.0, 0.11, 0.48);
    sim.staticBody(inst, [{ s: belt, p: [0.5, 0.11, 0], m: 'belt' }], 'metal');
    const dir = inst.dir(1, 0);
    const SPEED = 2.6, ACC = 30;
    const on = () => !inst.ch || sim.channels[inst.ch];
    belt.onTouch = (other) => {
      if (!on() || other.type !== CANNON.Body.DYNAMIC) return;
      const v = other.velocity;
      const par = v.x * dir.x + v.z * dir.z;
      const dv = clamp(SPEED - par, -ACC * DT, ACC * DT);
      v.x += dir.x * dv; v.z += dir.z * dv;
      // gently centre sideways drift
      const px = -dir.z, pz = dir.x;
      const side = v.x * px + v.z * pz;
      v.x -= px * side * 0.08; v.z -= pz * side * 0.08;
      other.wakeUp();
    };
    const lo = inst.local(-0.5, 0, -0.5), hi = inst.local(1.5, 0, 0.5);
    const box = { minX: Math.min(lo.x, hi.x), maxX: Math.max(lo.x, hi.x), minZ: Math.min(lo.z, hi.z), maxZ: Math.max(lo.z, hi.z), y: lo.y };
    if (inst.ch) sim.onChannel(inst.ch, () => sim.wakeInBox(box.minX, box.maxX, box.y, box.y + 1.5, box.minZ, box.maxZ));
    sim.addActor({ fx(dt) { if (on()) inst.v.tex.offset.x -= dt * SPEED * 1.5; }, hum: () => on() ? 0.4 : 0 });
  }
});

defPart('fan', {
  name: 'Desk Fan', cat: 'Machines', channel: 'device', blocksWind: true,
  desc: 'Blows light things away along its facing, up to 7 cells. Blocks stop the wind. Runs all the time unless wired to a coloured button.',
  build(inst) {
    const g = new THREE.Group();
    g.add(mk(gCyl(0.3, 0.34, 0.08, 24), MAT.darkMetal, -0.1, 0.04, 0));
    g.add(mk(gCyl(0.04, 0.04, 0.3, 10), MAT.steel, -0.1, 0.22, 0));
    g.add(mk(gCyl(0.13, 0.15, 0.3, 20), MAT.teal, -0.18, 0.5, 0, { rz: Math.PI / 2 }));
    const cage = new THREE.Group();
    cage.position.set(0.05, 0.5, 0);
    cage.add(mk(gTorus(0.38, 0.025, 8, 36), MAT.chrome, 0, 0, 0, { ry: Math.PI / 2 }));
    cage.add(mk(gTorus(0.25, 0.012, 6, 30), MAT.chrome, 0.06, 0, 0, { ry: Math.PI / 2 }));
    for (let s = 0; s < 6; s++) cage.add(mk(gBox(0.01, 0.76, 0.012), MAT.chrome, 0.06, 0, 0, { rx: (s / 6) * Math.PI }));
    const blades = new THREE.Group();
    for (let b = 0; b < 4; b++) {
      const bl = mk(gRBox(0.02, 0.3, 0.13, 0.01), MAT.teal, 0, 0.17, 0);
      const holder = new THREE.Group(); holder.rotation.x = (b / 4) * TAU; bl.rotation.y = 0.35; holder.add(bl); blades.add(holder);
    }
    blades.add(mk(gSphere(0.06, 12, 8), chMat(inst.ch), 0.02, 0, 0));
    cage.add(blades);
    g.add(cage);
    inst.v.blades = blades;
    inst.v.hub = blades.children[blades.children.length - 1];
    // wind streaks
    const streaks = new THREE.Group();
    const sm = new THREE.MeshBasicMaterial({ color: 0xdff6ff, transparent: true, opacity: 0.35, depthWrite: false });
    for (let s = 0; s < 14; s++) {
      const m = new THREE.Mesh(gBox(0.4, 0.012, 0.012), sm);
      m.userData.seed = Math.random();
      m.userData.y = 0.15 + Math.random() * 0.75; m.userData.z = (Math.random() - 0.5) * 0.85;
      streaks.add(m);
    }
    streaks.visible = false;
    g.add(streaks);
    inst.v.streaks = streaks;
    return g;
  },
  paintChannel(inst) { inst.v.hub.material = chMat(inst.ch); },
  reset(inst) { inst.v.streaks.visible = false; inst.spin = 0; },
  physics(inst, sim) {
    sim.staticBody(inst, [{ s: BOX(0.12, 0.34, 0.4), p: [0.0, 0.5, 0] }, { s: BOX(0.3, 0.05, 0.3), p: [-0.1, 0.05, 0] }], 'metal');
    // wind reach: stops at the first blocking cell
    let reach = 7;
    for (let s = 1; s <= 7; s++) {
      const [dx, dz] = rotXZ(s, 0, inst.r);
      const occ = sim.occAt(inst.i + dx, inst.j, inst.k + dz);
      if (occ && occ !== inst && occ.def.blocksWind) { reach = s - 0.5; break; }
    }
    inst.reach = reach;
    const on = () => !inst.ch || sim.channels[inst.ch];
    const P = 2.2;
    sim.addActor({
      pre() {
        if (!on()) return;
        const b = inst.base();
        for (const d of sim.dyn) {
          if (d.gone || !d.windArea) continue;
          const p = d.body.position;
          const [lx, lz] = rotXZ(p.x - b.x, p.z - b.z, 4 - inst.r);
          const ly = p.y - b.y;
          if (lx < 0.3 || lx > reach + 0.5 || ly < -0.05 || ly > 1.1 || Math.abs(lz) > 0.62) continue;
          const fall = 1 - 0.55 * (lx / (reach + 0.5));
          const F = P * d.windArea * fall;
          const [wx, wz] = rotXZ(1, 0, inst.r);
          d.body.applyForce(V3(wx * F, 0, wz * F));
          if (d.body.sleepState) d.body.wakeUp();
        }
      },
      fx(dt) {
        const active = on() && sim.running;
        inst.spin = lerp(inst.spin || 0, active ? 28 : 0, Math.min(1, dt * 3));
        inst.v.blades.rotation.x += inst.spin * dt;
        inst.v.streaks.visible = active;
        if (active) {
          for (const m of inst.v.streaks.children) {
            m.userData.seed = (m.userData.seed + dt * (0.9 + (m.userData.y % 0.3))) % 1;
            const t = m.userData.seed;
            m.position.set(0.4 + t * reach, m.userData.y, m.userData.z);
            m.scale.x = 0.5 + t;
            m.material.opacity = 0.35 * Math.sin(t * Math.PI);
          }
        }
      },
      hum: () => on() ? 0.7 : 0
    });
  }
});

defPart('ram', {
  name: 'Spring Ram', cat: 'Machines', channel: 'device',
  desc: 'Punches one cell forward. Fires once, half a second after the start, or when its coloured button is pressed.',
  build(inst) {
    const g = new THREE.Group();
    g.add(mk(gRBox(0.6, 0.12, 0.7, 0.03), MAT.darkMetal, -0.15, 0.06, 0));
    g.add(mk(gRBox(0.5, 0.42, 0.5, 0.06), MAT.red, -0.17, 0.33, 0));
    g.add(mk(gCyl(0.12, 0.12, 0.08, 20), MAT.brass, 0.1, 0.35, 0, { rz: Math.PI / 2 }));
    const lamp = mk(gSphere(0.06, 12, 8), chMat(inst.ch), -0.17, 0.58, 0);
    g.add(lamp); inst.v.lamp = lamp;
    const rod = mk(gCyl(0.045, 0.045, 1, 12), MAT.chrome, 0, 0.35, 0, { rz: Math.PI / 2 });
    g.add(rod); inst.v.rod = rod;
    const pad = new THREE.Group();
    pad.add(mk(gRBox(0.12, 0.42, 0.56, 0.05), MAT.rubber, 0, 0, 0));
    pad.add(mk(gRBox(0.06, 0.3, 0.44, 0.03), MAT.yellow, -0.07, 0, 0));
    g.add(pad); inst.v.pad = pad;
    return g;
  },
  paintChannel(inst) { inst.v.lamp.material = chMat(inst.ch); },
  reset(inst) { inst.v.pad.position.set(RAM_REST, 0.35, 0); ramRod(inst, RAM_REST); },
  physics(inst, sim) {
    sim.staticBody(inst, [{ s: BOX(0.26, 0.27, 0.27), p: [-0.17, 0.27, 0] }], 'metal');
    const pad = new CANNON.Body({ mass: 0, type: CANNON.Body.KINEMATIC, material: sim.mats.rubberPad });
    pad.addShape(BOX(0.06, 0.21, 0.28));
    const p0 = inst.local(RAM_REST, 0.35, 0);
    pad.position.set(p0.x, p0.y, p0.z);
    pad.quaternion.copy(cq('y', inst.r * Math.PI / 2));
    pad.allowSleep = false;
    sim.world.addBody(pad);
    const dir = inst.dir(1, 0);
    let state = 'idle', ext = 0, hold = 0, fired = false;
    const fire = () => { if (!fired) { fired = true; state = 'out'; sim.fx('ram', p0); } };
    if (inst.ch) sim.onChannel(inst.ch, fire);
    const EXT = 0.85, OUT = 7.5, BACK = 1.6;
    sim.addActor({
      pre(dt) {
        if (!inst.ch && !fired && sim.time >= 0.5) fire();
        let v = 0;
        if (state === 'out') { v = OUT; if (ext + v * dt >= EXT) { v = (EXT - ext) / dt; state = 'hold'; hold = 0.35; } }
        else if (state === 'hold') { hold -= dt; if (hold <= 0) state = 'back'; }
        else if (state === 'back') { v = -BACK; if (ext + v * dt <= 0) { v = -ext / dt; state = 'done'; } }
        ext += v * dt;
        pad.velocity.set(dir.x * v, 0, dir.z * v);
      },
      sync() {
        const lp = inst.toLocal(pad.position);
        inst.v.pad.position.set(lp.x, 0.35, lp.z);
        ramRod(inst, lp.x);
      }
    });
  }
});
const RAM_REST = 0.3;
function ramRod(inst, padX) {
  const start = 0.06, len = Math.max(0.01, padX - 0.05 - start);
  inst.v.rod.scale.y = len;
  inst.v.rod.position.x = start + len / 2;
}

defPart('magnet', {
  name: 'Horseshoe Magnet', cat: 'Machines', channel: 'device', blocksWind: true,
  desc: 'Pulls steel balls toward its open end, from up to 4 cells away. Always on unless wired to a coloured button.',
  build(inst) {
    const g = new THREE.Group();
    g.add(mk(gRBox(0.6, 0.1, 0.6, 0.03), MAT.darkMetal, -0.1, 0.05, 0));
    g.add(mk(gCyl(0.05, 0.05, 0.25, 10), MAT.steel, -0.25, 0.22, 0));
    const shoe = mk(gTorus(0.22, 0.085, 12, 28, Math.PI), MAT.red, -0.08, 0.5, 0, { rz: Math.PI / 2 });
    g.add(shoe);
    for (const s of [-1, 1]) {
      g.add(mk(gCyl(0.085, 0.085, 0.24, 14), MAT.red, 0.04, 0.5 + s * 0.22, 0, { rz: Math.PI / 2 }));
      g.add(mk(gCyl(0.086, 0.086, 0.1, 14), MAT.chrome, 0.2, 0.5 + s * 0.22, 0, { rz: Math.PI / 2 }));
    }
    const lamp = mk(gSphere(0.05, 12, 8), chMat(inst.ch), -0.32, 0.5, 0);
    g.add(lamp); inst.v.lamp = lamp;
    // field ripples
    const rip = new THREE.Group();
    const rm = new THREE.MeshBasicMaterial({ color: 0xff8a7a, transparent: true, opacity: 0.25, depthWrite: false, side: THREE.DoubleSide });
    for (let i = 0; i < 3; i++) { const t = new THREE.Mesh(gTorus(0.3, 0.01, 4, 32), rm.clone()); t.rotation.y = Math.PI / 2; t.position.set(0.3, 0.5, 0); rip.add(t); }
    rip.visible = false; g.add(rip); inst.v.rip = rip;
    return g;
  },
  paintChannel(inst) { inst.v.lamp.material = chMat(inst.ch); },
  reset(inst) { inst.v.rip.visible = false; },
  physics(inst, sim) {
    sim.staticBody(inst, [{ s: BOX(0.18, 0.32, 0.12), p: [-0.05, 0.5, 0] }, { s: BOX(0.3, 0.05, 0.3), p: [-0.1, 0.05, 0] }], 'metal');
    const pole = inst.local(0.3, 0.5, 0);
    const on = () => !inst.ch || sim.channels[inst.ch];
    sim.addActor({
      pre() {
        if (!on()) return;
        const b = inst.base();
        for (const d of sim.dyn) {
          if (d.gone || !d.magnetic) continue;
          const p = d.body.position;
          const [lx] = rotXZ(p.x - b.x, p.z - b.z, 4 - inst.r);
          if (lx < 0.1) continue;
          const dx = pole.x - p.x, dy = pole.y - p.y, dz = pole.z - p.z;
          const d2 = dx * dx + dy * dy + dz * dz;
          if (d2 > 4.5 * 4.5) continue;
          const L = Math.sqrt(d2) || 1;
          const F = Math.min(40, d.body.mass * 15 / (d2 + 0.35));
          d.body.applyForce(V3(dx / L * F, dy / L * F, dz / L * F));
          if (d.body.sleepState) d.body.wakeUp();
        }
      },
      fx(dt) {
        const active = on() && sim.running;
        inst.v.rip.visible = active;
        if (active) inst.v.rip.children.forEach((t, i) => {
          const ph = ((sim.time * 0.8 + i / 3) % 1);
          t.position.x = 0.3 + ph * 2.2; t.scale.setScalar(1 + ph * 2.5); t.material.opacity = 0.3 * (1 - ph);
        });
      }
    });
  }
});

defPart('cactus', {

  desc: 'Prickly all over, pot included. Pops any balloon that touches it.',
  build(inst) {

const BIN_GROUPS = ['Structure', 'Bouncers', 'Objects', 'Machines', 'Hazards', 'Goals'];

// ============================================================================
//  Simulation — builds a cannon-es world from the placed parts and runs it at a
//  fixed 240 Hz. Everything that matters (goals, triggers) is evaluated per
//  physics step, so a run is identical whatever the frame rate.
// ============================================================================
function makePhysMats() {
  const M = (friction, restitution) => new CANNON.Material({ friction, restitution });
  const mats = {
    floor: M(0.6, 0.55), wood: M(0.55, 0.6), woodSoft: M(0.6, 0.15), metal: M(0.35, 0.6), slick: M(0.04, 0.05),
    dead: M(0.4, 0), belt: M(1.0, 0.05), clay: M(0.6, 0.35), rubberPad: M(0.9, 0.3),
    bowling: M(0.5, 0.3), rubber: M(0.9, 0.95), steel: M(0.4, 0.5), beach: M(0.7, 0.85),
    balloon: M(0.3, 0.6), domino: M(0.45, 0.5), crate: M(0.4, 0.15)
  };
  return mats;
}

const _q = new THREE.Quaternion(), _q2 = new THREE.Quaternion(), _up = new THREE.Vector3(0, 1, 0);

class Sim {
  constructor(insts, goals, opts = {}) {
    this.silent = !!opts.silent;
    this.listeners = opts.listeners || {};
    this.running = true;
    const world = this.world = new CANNON.World({ gravity: V3(0, -G, 0), allowSleep: true });
    world.broadphase = new CANNON.SAPBroadphase(world);
    world.solver.iterations = 18;
    // cannon-es clamps friction *impulses* per step against mu*|frictionGravity|*m, i.e. it
    // treats the slip force as an impulse. Scaling by DT restores physical Coulomb friction.
    world.frictionGravity = V3(0, G * DT, 0);
    world.defaultContactMaterial.friction = 0.45;
    world.defaultContactMaterial.restitution = 0.3;
    this.mats = makePhysMats();
    this.time = 0;
    this.steps = 0;
    this.channels = {};
    this.chListeners = {};
    this.actors = [];
    this.dyn = [];
    this.containers = {};
    this.flags = {};
    this.removeQueue = [];
    this.quiet = 0;
    this.goals = goals || [];
    this.goalState = this.goals.map(() => false);
    this.insideT = this.goals.map(() => 0);
    this.insts = insts;
    this.occ = new Map();
    for (const inst of insts) for (const c of inst.cells()) this.occ.set(c.join(','), inst);
    const floor = new CANNON.Body({ mass: 0, type: CANNON.Body.STATIC, material: this.mats.floor });
    floor.addShape(BOX(BOARD.w / 2 + 7, 0.5, BOARD.d / 2 + 6), V3(0, -0.5, 1));
    world.addBody(floor);
    // fixed order: statics first so pairs & ids are stable
    const sorted = insts.slice().sort((a, b) => (a.def.dynamic ? 1 : 0) - (b.def.dynamic ? 1 : 0));
    for (const inst of sorted) inst.def.physics?.(inst, this);
  }

  occAt(i, j, k) { return this.occ.get(i + ',' + j + ',' + k); }

  // One cannon body per material: cannon-es takes restitution from *body* materials,
  // so e.g. a slick curved wall must not share a body with a bouncy wooden floor.
  staticBody(inst, list, mat) {
    const groups = new Map();
    for (const e of list) {
      const m = e.m || mat || 'wood';
      if (!groups.has(m)) groups.set(m, []);
      groups.get(m).push(e);
    }
    const p = inst.base();
    const q = cq('y', inst.r * Math.PI / 2);
    let first = null;
    for (const [m, entries] of groups) {
      const b = new CANNON.Body({ mass: 0, type: CANNON.Body.STATIC, material: this.mats[m] });
      for (const e of entries) {
        e.s.material = this.mats[m];
        b.addShape(e.s, V3(e.p[0], e.p[1], e.p[2]), e.q);
      }
      b.position.set(p.x, p.y, p.z);
      b.quaternion.copy(q);
      b.userData = { inst };
      this.world.addBody(b);
      if (!first) first = b;
    }
    return first;
  }

  dynBody(inst, o) {
    const b = new CANNON.Body({ mass: o.mass, material: this.mats[o.mat] });
    for (const e of o.shapes) { e.s.material = this.mats[o.mat]; b.addShape(e.s, e.p ? V3(e.p[0], e.p[1], e.p[2]) : undefined, e.q); }
    const c = o.center || inst.def.center || [0, 0, 0];
    const p = inst.local(c[0], c[1], c[2]);
    b.position.set(p.x, p.y, p.z);
    let q = cq('y', inst.r * Math.PI / 2);
    if (o.q0) q = q.mult(o.q0);
    b.quaternion.copy(q);
    b.linearDamping = o.linDamp ?? 0.02;
    b.angularDamping = o.angDamp ?? 0.05;
    b.allowSleep = true;
    b.sleepSpeedLimit = 0.1;
    b.sleepTimeLimit = 0.6;
    if (o.noRotate) b.angularFactor.set(0, 0, 0);
    const d = {
      inst, body: b, pv: new CANNON.Vec3(), windArea: o.windArea || 0, magnetic: !!o.magnetic,
      balloon: !!o.balloon, child: o.child || null, snd: o.snd || 'wood', gone: false, roll: o.roll || 0, grounded: false, radius: o.radius || 0
    };
    b.userData = { inst, dyn: d };
    this.world.addBody(b);
    this.dyn.push(d);
    if (!this.silent) {
      b.addEventListener('collide', (e) => {
        const od = e.body.userData && e.body.userData.dyn;
        if (od && e.body.id < b.id) return; // one sound per dynamic pair
        const v = Math.abs(e.contact.getImpactVelocityAlongNormal());
        if (v > 0.7) this.fx('hit', b.position, { v, snd: d.snd, other: od ? od.snd : (e.body.userData?.inst?.def.id || 'floor') });
      });
    }
    return d;
  }

  addActor(a) { this.actors.push(a); return a; }

  onChannel(ch, fn) { (this.chListeners[ch] ||= []).push(fn); if (this.channels[ch]) fn(); }
  activate(ch, pos) {
    if (this.channels[ch]) return;
    this.channels[ch] = true;
    for (const fn of this.chListeners[ch] || []) fn();
    this.fx('channel', pos, ch);
  }
  flag(key, pos) {
    if (this.flags[key] !== undefined) return;
    this.flags[key] = this.time;
    this.listeners.flag?.(key, pos);
  }
  fx(kind, pos, val) { if (!this.silent && this.listeners.fx) this.listeners.fx(kind, pos, val); }

  wakeInBox(minX, maxX, minY, maxY, minZ, maxZ) {
    for (const d of this.dyn) {
      const p = d.body.position;
      if (!d.gone && p.x > minX && p.x < maxX && p.y > minY && p.y < maxY && p.z > minZ && p.z < maxZ) d.body.wakeUp();
    }
  }
  removeDyn(d, why) { if (d.gone) return; d.gone = true; d.why = why; this.removeQueue.push(d); }
  popBalloon(d) {
    if (d.gone) return;
    const p = new THREE.Vector3().copy(d.body.position);
    this.flag('pop:' + d.inst.id, p);
    this.fx('pop', p);
    this.removeDyn(d, 'pop');
  }

  step() {
    for (const d of this.dyn) { const v = d.body.velocity; d.pv.set(v.x, v.y, v.z); }
    for (const a of this.actors) if (a.pre) a.pre(DT, this);
    this.world.step(DT);
    const cs = this.world.contacts;
    for (let n = 0; n < cs.length; n++) {
      const c = cs[n];
      // cannon-es may swap bi/bj relative to si/sj, so resolve owners via shape.body
      if (c.si.onTouch) c.si.onTouch(c.si.body === c.bi ? c.bj : c.bi, c);
      if (c.sj.onTouch) c.sj.onTouch(c.sj.body === c.bj ? c.bi : c.bj, c);
      if (c.ni.y > 0.5 || c.ni.y < -0.5) {
        const da = c.bi.userData && c.bi.userData.dyn, db = c.bj.userData && c.bj.userData.dyn;
        if (da && da.roll) da.grounded = true;
        if (db && db.roll) db.grounded = true;
      }
    }
    // rolling resistance for balls that are actually resting on something
    for (const d of this.dyn) {
      if (!d.grounded) continue;
      d.grounded = false;
      const f = 1 - d.roll * DT, v = d.body.velocity, w = d.body.angularVelocity;
      v.x *= f; v.z *= f; w.x *= f; w.y *= f; w.z *= f;
    }
    for (const a of this.actors) if (a.post) a.post(DT, this);
    let moving = false;
    for (const d of this.dyn) {
      if (d.gone) continue;
      const b = d.body;
      if (b.position.y < -6) { this.removeDyn(d, 'fell'); continue; }
      if (b.sleepState !== CANNON.Body.SLEEPING && (b.velocity.lengthSquared() > 0.01 || b.angularVelocity.lengthSquared() > 0.04)) moving = true;
    }
    for (const d of this.removeQueue) { this.world.removeBody(d.body); }
    this.removeQueue.length = 0;
    this.quiet = moving ? 0 : this.quiet + DT;
    this.time += DT;
    this.steps++;
    this.evalGoals();
  }

  evalGoals() {
    for (let g = 0; g < this.goals.length; g++) {
      if (this.goalState[g]) continue;
      const goal = this.goals[g];
      let ok = false;
      switch (goal.type) {
        case 'ring': case 'pop': case 'press': case 'light':
          ok = this.flags[goal.type + ':' + goal.id] !== undefined; break;
        case 'inside': {
          const box = this.containers[goal.id];
          let inside = false;
          if (box) for (const d of this.dyn) {
            if (d.gone) continue;
            if (goal.what && goal.what !== 'any' && d.inst.type !== goal.what && d.inst.id !== goal.what) continue;
            const p = d.body.position;
            if (p.x > box.minX && p.x < box.maxX && p.y > box.minY && p.y < box.maxY && p.z > box.minZ && p.z < box.maxZ) { inside = true; break; }
          }
          this.insideT[g] = inside ? this.insideT[g] + DT : 0;
          ok = this.insideT[g] >= 0.4;
          if (ok) this.listeners.flag?.('inside:' + goal.id, box.pos);
          break;
        }
        case 'topple': {
          let all = true, any = false;
          for (const d of this.dyn) {
            if (d.inst.type !== (goal.what || 'domino')) continue;
            any = true;
            const q = d.body.quaternion;
            const upY = 1 - 2 * (q.x * q.x + q.z * q.z); // y component of body's up axis
            if (!d.gone && upY > 0.5) { all = false; break; }
          }
          ok = any && all; break;
        }
        case 'away': ok = this.dyn.some(d => d.inst.id === goal.id && d.gone && d.why === 'away'); break;
      }
      if (ok) { this.goalState[g] = true; this.listeners.goal?.(g, goal); }
    }
  }
  get won() { return this.goals.length > 0 && this.goalState.every(Boolean); }

  hum() { let h = 0; for (const a of this.actors) if (a.hum) h = Math.max(h, a.hum()); return h; }

  sync() {
    for (const d of this.dyn) {
      if (d.gone) { d.inst.group.visible = false; continue; }
      const b = d.body;
      if (d.child) {
        d.inst.toLocal(b.position, d.child.position);
        _q.setFromAxisAngle(_up, -d.inst.r * Math.PI / 2);
        _q2.set(b.quaternion.x, b.quaternion.y, b.quaternion.z, b.quaternion.w);
        d.child.quaternion.copy(_q).multiply(_q2);
      } else {
        d.inst.group.position.set(b.position.x, b.position.y, b.position.z);
        d.inst.group.quaternion.set(b.quaternion.x, b.quaternion.y, b.quaternion.z, b.quaternion.w);
      }
    }
    for (const a of this.actors) if (a.sync) a.sync();
  }
  fxFrame(dt) { for (const a of this.actors) if (a.fx) a.fx(dt); }
}
